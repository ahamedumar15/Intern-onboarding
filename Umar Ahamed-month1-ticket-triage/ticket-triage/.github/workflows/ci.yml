name: ci

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells nobody anything useful, and the queue is shared.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A local SQLite file path, not a secret (NFR-6). `next build` needs
  # DATABASE_URL present even though every page is force-dynamic.
  DATABASE_URL: "file:./dev.db"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    # NFR-4 caps the pipeline at 180 s; this is the tripwire, not the target.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must precede setup-node so that `cache: pnpm` can find the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ADR-001 records that CI misses NFR-4 without BOTH caches: the pnpm
      # store (above) and the Next.js build cache (below).
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      # The root `postinstall` script runs `prisma generate`, so the
      # @prisma/client types exist before typecheck (ADR-002 consequence).
      # Without it, tsc fails with a misleading "cannot find module" error.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (0 errors required)
        run: pnpm lint

      - name: Type check (0 errors required)
        run: pnpm typecheck

      - name: Unit tests (100% pass required)
        run: pnpm test

      - name: Build
        run: pnpm build
